<!doctype html>
<html lang="fr"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Connexion - Créneaux DSV Angers</title><link rel="icon" type="image/png" href="/logo.png">
<style>
:root{color-scheme:light;--bg:#f3f5f8;--surface:#fff;--line:#d5dbe5;--fg:#172234;--muted:#5b677a;--ink:#0f2a5c;--accent:#2F80D8;--accent-fg:#ffffff;--bad:#b4232a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,"Segoe UI",sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgb(0 0 0 / .08)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}.brand img{width:44px;height:44px;border-radius:8px}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;letter-spacing:.06em}
button{font:600 16px system-ui,sans-serif;border:0;border-radius:6px;padding:11px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--bad);font-size:14px;min-height:1.4em;margin:0}
.pw{position:relative;display:block}.pw input{padding-right:44px}input::-ms-reveal,input::-ms-clear{display:none}
button.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:34px;padding:0;background:transparent;color:var(--fg);display:grid;place-items:center}
button.eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.portail{display:block;text-align:center;font-size:14px;font-weight:600;color:var(--accent)}.portail[hidden]{display:none}
.credit{position:fixed;left:0;right:0;bottom:12px;margin:0;text-align:center;font-size:11px;opacity:.55}</style><style id="nozoom">html{-webkit-text-size-adjust:100%;text-size-adjust:100%}@media (pointer:coarse),(max-width:900px){input,select,textarea{font-size:16px!important}}</style>
</head><body>
<form class="box" id="f" autocomplete="off">
  <div class="brand"><img src="/logo.png" alt="DSV"><span>CRÉNEAUX<small>DSV ANGERS · LIVRAISONS 49</small></span></div>
  <p style="margin:0;font-size:14px;color:var(--muted)">On entre dans cette appli par le portail DSV Angers. Ici, seul le code de secours fonctionne.</p>
  <label>Code de secours<span class="pw"><input id="c" type="password" required autofocus autocomplete="one-time-code" enterkeyhint="go"><button type="button" class="eye" id="eye" aria-label="Afficher le code" title="Afficher / masquer le code"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
  <p class="err" id="e" role="alert"></p>
  <button id="b" type="submit">Se connecter</button>
  <a class="portail" id="portail" hidden>Entrer avec mon code personnel, par le portail</a>
</form>
<p class="credit">Antoine Macé · DSV Angers</p>
<script>
{const u="__PORTAIL__";if(/^https:\/\//.test(u)){const a=document.getElementById("portail");a.href=u+"/";a.hidden=false}}
document.getElementById("eye").onclick=()=>{const i=document.getElementById("c"),h=i.type==="password";i.type=h?"text":"password";document.getElementById("eye").setAttribute("aria-label",h?"Masquer le code":"Afficher le code");i.focus()};
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById("b"),e=document.getElementById("e");b.disabled=true;e.textContent="";const t0=b.textContent;b.textContent="Connexion…";
  try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:document.getElementById("c").value})});
    if(r.ok){const k=await fetch("/api/moi",{cache:"no-store"});if(k.ok){location.replace("/");return}
      e.textContent="Code accepté, mais le navigateur n'a pas gardé la connexion (erreur "+k.status+").";b.disabled=false;b.textContent=t0;return}
    e.textContent=r.status===429?"Trop de codes faux : patientez quelques minutes.":r.status===401?"Code incorrect ou désactivé.":"Erreur du serveur ("+r.status+") : "+(await r.text()).slice(0,200);document.getElementById("c").select()}
  catch(_){e.textContent="Serveur injoignable : réessayez dans un instant."}
  b.disabled=false;b.textContent=t0};
</script></body></html>
